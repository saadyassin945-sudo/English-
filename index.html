<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>English QBank</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg1:#0a0f1f;--bg2:#1a2639;--bg3:#2d3a4f;--primary:#4fc3f7;--primary-dark:#0288d1;--accent:#ffd54f;--danger:#ef5350;--success:#66bb6a;--text:#e2e8f0;--muted:#a0aec0;--radius:16px;--shadow:0 10px 30px rgba(0,0,0,0.4);--glow:0 0 25px rgba(79,195,247,0.12);--max-width:600px;--bg-card:rgba(255,255,255,0.06);--border-card:rgba(255,255,255,0.06)}
body.light{--bg1:#fff;--bg2:#fff;--bg3:#fff;--bg-card:#fff;--border-card:#ccc;--text:#000;--muted:#555;--primary:#1565c0;--primary-dark:#0d47a1;--accent:#f9a825;--danger:#c62828;--success:#2e7d32;--shadow:0 2px 8px rgba(0,0,0,0.08);--glow:none;background:#fff!important;background-image:none!important}
body{font-family:"Tahoma","Segoe UI","Cairo",sans-serif;background:var(--bg1);min-height:100vh;color:var(--text);display:flex;flex-direction:column;align-items:center;padding:12px 10px;transition:background .4s,color .3s}
.app{width:100%;max-width:var(--max-width);position:relative;z-index:1}
.top-header{text-align:center;padding:8px 0 4px}
.top-header h1{font-size:1.8rem;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--primary-dark));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
body.light .top-header h1{background:none;-webkit-background-clip:unset;-webkit-text-fill-color:unset;color:#000;text-shadow:none}
.top-header .sub{font-size:.9rem;color:var(--primary);font-weight:600}
.top-header .creator{font-size:.7rem;color:var(--muted);margin-top:4px}
.top-header .creator .name{color:var(--text);font-weight:700}
body.light .top-header .creator .name{color:#000}
.theme-toggle-wrap{display:flex;justify-content:flex-end;margin-bottom:6px}
.theme-toggle{display:flex;background:var(--bg-card);border:1px solid var(--border-card);border-radius:30px;padding:3px;gap:2px}
.theme-toggle button{background:transparent;border:none;padding:4px 14px;border-radius:30px;font-size:.8rem;color:var(--muted);cursor:pointer;transition:.3s}
.theme-toggle button.active{background:var(--primary);color:#fff;font-weight:700}
body.light .theme-toggle button.active{background:#1565c0;color:#fff}
.card{background:var(--bg-card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--border-card);border-radius:var(--radius);box-shadow:var(--shadow),var(--glow);padding:16px 14px;margin-bottom:14px;transition:transform .2s,background .3s,border .3s;color:var(--text)}
body.light .card{background:#fff;border:1px solid #ccc;backdrop-filter:none}
.card-title{margin:0 0 12px;font-size:1rem;border-inline-start:3px solid var(--primary);padding-inline-start:10px;font-weight:600}
.card-title i{color:var(--accent);margin-left:6px}
.action-icons{display:flex;justify-content:space-around;gap:6px;flex-wrap:wrap}
.action-icon{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:6px 14px;border-radius:12px;border:1.5px solid transparent;background:transparent;color:var(--muted);font-size:.7rem;font-weight:600;min-width:56px}
.action-icon .icon{font-size:1.5rem}
.action-icon .label{font-size:.55rem}
.action-icon.active{border-color:var(--primary);background:rgba(79,195,247,0.08)}
body.light .action-icon.active{border-color:#1565c0;background:#e3f2fd}
.sub-options{display:none;padding:8px 10px;margin-top:6px;background:rgba(0,0,0,0.15);border-radius:12px;border:1px solid var(--border-card);flex-wrap:wrap;gap:6px;justify-content:center}
body.light .sub-options{background:#f5f5f5;border-color:#ccc}
.sub-options.show{display:flex}
.sub-options .action-btn{border:1px solid var(--border-card);background:rgba(255,255,255,0.03);border-radius:12px;padding:5px 16px;font-size:.75rem;font-weight:600;color:var(--muted);cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
body.light .sub-options .action-btn{background:#fff;border-color:#ccc;color:#333}
.sub-options .action-btn.active{border-color:var(--primary);background:rgba(79,195,247,0.12);color:var(--text)}
body.light .sub-options .action-btn.active{border-color:#1565c0;background:#bbdefb;color:#000}
.section-list{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow-y:auto}
.section-item{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--border-card);border-radius:10px;padding:8px 12px;cursor:pointer;transition:all .15s;font-size:.85rem;color:var(--text)}
body.light .section-item{border-color:#ccc}
.section-item.active{border-color:var(--primary);background:rgba(79,195,247,0.08)}
body.light .section-item.active{border-color:#1565c0;background:#e3f2fd}
.section-item .cnt{background:rgba(255,255,255,0.06);border-radius:30px;padding:0 10px;font-size:.7rem;color:var(--muted);font-weight:700;min-width:30px;text-align:center}
body.light .section-item .cnt{background:#ddd;color:#333}
.section-item .info-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:0 4px}
.section-item .info-btn:hover{color:var(--primary)}
#section-explanation{margin-top:12px;padding:16px;background:rgba(0,0,0,0.15);border-radius:var(--radius);border:1px solid var(--border-card);display:none}
body.light #section-explanation{background:#f5f5f5;border-color:#ccc}
#section-explanation.show{display:block}
.explain-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.explain-controls{display:flex;gap:6px;align-items:center}
.explain-controls .lang-btn{background:rgba(255,255,255,0.06);border:1px solid var(--border-card);color:var(--muted);padding:4px 10px;border-radius:20px;font-size:.7rem;cursor:pointer;font-weight:600}
body.light .explain-controls .lang-btn{background:#fff;border-color:#ccc;color:#333}
.explain-controls .lang-btn.active{border-color:var(--primary);background:rgba(79,195,247,0.12);color:var(--text)}
body.light .explain-controls .lang-btn.active{border-color:#1565c0;background:#bbdefb;color:#000}
.explain-controls .close-explain{background:none;border:none;color:var(--muted);font-size:1.2rem;cursor:pointer}
.explain-controls .close-explain:hover{color:var(--danger)}
#explain-text{font-size:.9rem;line-height:2;color:var(--text);background:rgba(0,0,0,0.1);padding:12px;border-radius:10px;min-height:60px;white-space:pre-wrap}
body.light #explain-text{background:#fff;color:#000;border:1px solid #ccc}
.big-btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;font-size:1rem;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(79,195,247,0.25);transition:all .15s;position:relative;overflow:hidden}
body.light .big-btn{background:#1565c0;color:#fff;box-shadow:0 2px 8px rgba(21,101,192,0.3)}
.big-btn.secondary{background:linear-gradient(135deg,#4a5568,#2d3748)}
body.light .big-btn.secondary{background:#757575}
.big-btn.warn{background:linear-gradient(135deg,var(--accent),#f57f17)}
body.light .big-btn.warn{background:#f9a825;color:#000}
.big-btn:disabled{opacity:.5;cursor:not-allowed}
.stats-row{display:flex;justify-content:space-around;gap:8px;text-align:center;margin:6px 0}
.stats-row .stat .num{font-size:1.4rem;font-weight:800;background:linear-gradient(135deg,var(--primary),#81d4fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
body.light .stats-row .stat .num{background:none;-webkit-background-clip:unset;-webkit-text-fill-color:unset;color:#000}
.stats-row .stat .lbl{font-size:.7rem;color:var(--muted)}
.progress-stats{display:flex;align-items:center;gap:16px}
.progress-ring{position:relative;width:70px;height:70px;flex-shrink:0}
.progress-ring svg{transform:rotate(-90deg);width:70px;height:70px}
.progress-ring .bg{fill:none;stroke:var(--border-card);stroke-width:6}
body.light .progress-ring .bg{stroke:#ccc}
.progress-ring .fg{fill:none;stroke:var(--primary);stroke-width:6;stroke-linecap:round;stroke-dasharray:176;stroke-dashoffset:176;transition:stroke-dashoffset .6s}
body.light .progress-ring .fg{stroke:#1565c0}
.progress-ring .center-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:700;color:var(--text)}
.weak-link{margin-top:10px;font-size:.75rem;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px}
.weak-link i{color:var(--accent)}
.action-row-bottom{display:flex;gap:8px;margin-top:10px}
.action-row-bottom .big-btn{flex:1;font-size:.75rem;padding:8px;margin-top:0}
#screen-quiz,#screen-results{display:none}
#screen-quiz.active,#screen-results.active{display:block}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;font-size:.75rem;color:var(--muted);margin-bottom:8px}
#timer-badge{font-weight:600;font-size:.8rem;background:rgba(255,255,255,0.05);padding:2px 12px;border-radius:30px;border:1px solid var(--border-card)}
body.light #timer-badge{background:#f0f0f0;border-color:#ccc}
#timer-badge.warn{background:rgba(255,213,79,0.15);border-color:var(--accent);color:var(--accent)}
#timer-badge.danger{background:rgba(239,83,80,0.2);border-color:var(--danger);color:var(--danger);animation:pulse .7s infinite alternate}
@keyframes pulse{0%{opacity:1}100%{opacity:.5}}
.progress-wrap{background:rgba(255,255,255,0.06);border-radius:30px;height:4px;overflow:hidden;margin-bottom:12px}
body.light .progress-wrap{background:#ddd}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));width:0%;transition:width .3s}
body.light .progress-bar{background:linear-gradient(90deg,#1565c0,#f9a825)}
.q-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px}
.q-tag{display:inline-block;background:rgba(79,195,247,0.10);color:var(--primary);font-size:.65rem;font-weight:700;padding:2px 12px;border-radius:30px;border:1px solid rgba(79,195,247,0.06);margin-bottom:8px}
body.light .q-tag{background:#e3f2fd;color:#1565c0;border-color:#bbdefb}
.q-en{font-size:1.2rem;font-weight:700;color:var(--text);margin-bottom:4px;line-height:1.6;direction:ltr;text-align:left;word-wrap:break-word}
.q-ar{font-size:1.1rem;color:var(--muted);margin-bottom:14px;line-height:1.7;direction:rtl;text-align:right;word-wrap:break-word}
.options{display:flex;flex-direction:column;gap:8px}
.option{display:flex;align-items:center;gap:8px;border:1px solid var(--border-card);border-radius:12px;padding:12px 16px;cursor:pointer;transition:all .15s;background:rgba(255,255,255,0.02);direction:ltr}
body.light .option{background:#fff;border-color:#ccc}
.option .opt-en{font-weight:600;color:var(--text);font-size:1.1rem;flex:1;direction:ltr;text-align:left}
.option .opt-ar{color:var(--muted);font-size:1rem;direction:rtl;text-align:right;flex:1}
.option .mark{font-size:1.3rem;width:28px;text-align:center;flex-shrink:0}
.option.selected{border-color:var(--primary);background:rgba(79,195,247,0.06)}
body.light .option.selected{border-color:#1565c0;background:#e3f2fd}
.option.correct{border-color:var(--success);background:rgba(102,187,106,0.08)}
body.light .option.correct{border-color:#2e7d32;background:#e8f5e9}
.option.wrong{border-color:var(--danger);background:rgba(239,83,80,0.08)}
body.light .option.wrong{border-color:#c62828;background:#ffebee}
.option.disabled{cursor:default;opacity:.8}
.feedback-box{margin-top:12px;padding:12px;border-radius:12px;font-size:.95rem;line-height:1.6}
.feedback-box.correct{background:rgba(102,187,106,0.08);border:1px solid rgba(102,187,106,0.15);color:#a7f3d0}
body.light .feedback-box.correct{background:#e8f5e9;border-color:#2e7d32;color:#000}
.feedback-box.wrong{background:rgba(239,83,80,0.08);border:1px solid rgba(239,83,80,0.15);color:#fecaca}
body.light .feedback-box.wrong{background:#ffebee;border-color:#c62828;color:#000}
.feedback-box .fb-title{font-weight:700;margin-bottom:4px}
.nav-row{display:flex;gap:8px;margin-top:12px}
.nav-row .big-btn{flex:1;margin-top:0;font-size:.85rem;padding:10px}
.score-circle{width:120px;height:120px;border-radius:50%;margin:8px auto 14px;display:flex;align-items:center;justify-content:center;flex-direction:column;background:conic-gradient(var(--primary) calc(var(--pct)*1%),rgba(255,255,255,0.04) 0);position:relative}
body.light .score-circle{background:conic-gradient(#1565c0 calc(var(--pct)*1%),#e0e0e0 0)}
.score-circle::before{content:"";position:absolute;width:90px;height:90px;background:var(--bg1);backdrop-filter:blur(4px);border-radius:50%;opacity:.85}
body.light .score-circle::before{background:#fff;opacity:.9}
.score-circle .pct{position:relative;font-size:1.8rem;font-weight:900;color:#fff}
body.light .score-circle .pct{color:#000}
.score-circle .lbl{position:relative;font-size:.7rem;color:var(--muted)}
.mistake-item{border:1px solid var(--border-card);border-radius:12px;padding:12px;margin-bottom:10px;background:rgba(255,255,255,0.02)}
body.light .mistake-item{background:#fff;border-color:#ccc}
.mistake-item .m-q{font-weight:700;margin-bottom:2px}
.mistake-item .m-you{color:var(--danger);font-size:.8rem}
body.light .mistake-item .m-you{color:#c62828}
.mistake-item .m-correct{color:var(--success);font-size:.8rem}
body.light .mistake-item .m-correct{color:#2e7d32}
.mistake-toggle{background:none;border:1px solid var(--border-card);border-radius:8px;padding:4px 12px;cursor:pointer;color:var(--text);font-size:.75rem;margin-top:6px}
body.light .mistake-toggle{border-color:#ccc;color:#000}
.mistake-detail{margin-top:10px;border:1px solid var(--border-card);border-radius:10px;padding:12px;background:rgba(255,255,255,0.03)}
body.light .mistake-detail{background:#f9f9f9;border-color:#ccc}
.mistake-detail .opt-row{display:flex;align-items:center;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border-card)}
body.light .mistake-detail .opt-row{border-color:#ddd}
.mistake-detail .opt-row:last-child{border-bottom:none}
.mistake-detail .opt-label{flex:1}
.mistake-detail .opt-status{font-size:1rem;margin-right:8px}
.hidden{display:none!important}
footer{text-align:center;color:var(--muted);font-size:.7rem;margin-top:20px;margin-bottom:8px;opacity:.6}
footer .name{color:var(--primary);font-weight:700}
body.light footer .name{color:#1565c0}
.word-en{display:inline-block;cursor:default;transition:background .15s,transform .1s;padding:1px 2px;border-radius:4px;direction:ltr}
.word-en:active{background:rgba(79,195,247,0.15);transform:scale(.97)}
body.light .word-en:active{background:#bbdefb}
.word-en.speaking{background:rgba(255,213,79,0.25);box-shadow:0 0 10px rgba(255,213,79,0.2)}
body.light .word-en.speaking{background:#fff9c4}
.speech-hint{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.7);backdrop-filter:blur(6px);color:#fff;padding:6px 18px;border-radius:30px;font-size:.8rem;pointer-events:none;opacity:0;transition:opacity .3s;z-index:999;border:1px solid rgba(255,255,255,0.1)}
body.light .speech-hint{background:#f0f0f0;color:#000;border-color:#ccc}
.speech-hint.show{opacity:1}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,0.25);transform:scale(0);animation:rippleAnim .5s linear;pointer-events:none}
body.light .ripple{background:rgba(0,0,0,0.1)}
@keyframes rippleAnim{to{transform:scale(3);opacity:0}}
@media(max-width:480px){body{padding:8px 6px}.app{max-width:100%}.top-header h1{font-size:1.5rem}.card{padding:12px 10px}.action-icon{padding:4px 8px;min-width:44px}.action-icon .icon{font-size:1.2rem}.q-en{font-size:1.1rem}.q-ar{font-size:1rem}.option{padding:10px 12px}.option .opt-en{font-size:1rem}.option .opt-ar{font-size:.95rem}.big-btn{font-size:.95rem;padding:10px}.score-circle{width:100px;height:100px}.score-circle::before{width:75px;height:75px}.score-circle .pct{font-size:1.5rem}.progress-ring{width:56px;height:56px}.progress-ring svg{width:56px;height:56px}}
.tf-badge{display:inline-block;font-size:.6rem;font-weight:700;padding:1px 8px;border-radius:12px;margin-right:6px;background:rgba(79,195,247,0.15);color:var(--primary)}
body.light .tf-badge{background:#e3f2fd;color:#1565c0}
</style>
</head>
<body>
<div class="app">
<div class="top-header"><h1>  متنسانيش في دعوة حلوة🤍 </h1><div class="sub">English QBank</div><div class="creator"><i class="fas fa-user-graduate"></i> Created by <span class="name">MR. YASSIN THARWAT</span></div></div>
<div class="theme-toggle-wrap"><div class="theme-toggle" id="themeToggle"><button class="active" data-theme="dark" onclick="setTheme('dark')"><i class="fas fa-moon"></i></button><button data-theme="light" onclick="setTheme('light')"><i class="fas fa-sun"></i></button></div></div>

<div id="main-screen">
<div class="card"><div class="card-title"><i class="fas fa-sliders-h"></i> الإجراءات</div>
<div class="action-icons">
<div class="action-icon active" data-target="modeOptions" onclick="toggleOptions('modeOptions')"><span class="icon">🎯</span><span class="label">المذاكرة</span></div>
<div class="action-icon" data-target="orderOptions" onclick="toggleOptions('orderOptions')"><span class="icon">🔀</span><span class="label">الترتيب</span></div>
<div class="action-icon" data-target="langOptions" onclick="toggleOptions('langOptions')"><span class="icon">🌐</span><span class="label">اللغة</span></div>
<div class="action-icon" data-target="timerOptions" onclick="toggleOptions('timerOptions')"><span class="icon">⏱️</span><span class="label">المؤقت</span></div>
</div>
<div id="modeOptions" class="sub-options show"><button class="action-btn active" data-mode="practice" onclick="selectMode('practice')">تدريب</button><button class="action-btn" data-mode="test" onclick="selectMode('test')">اختبار</button></div>
<div id="orderOptions" class="sub-options"><button class="action-btn active" data-order="device" onclick="selectOrder('device')">بالترتيب</button><button class="action-btn" data-order="random" onclick="selectOrder('random')">عشوائي</button></div>
<div id="langOptions" class="sub-options"><button class="action-btn active" data-translate="yes" onclick="selectTranslate('yes')">ترجمة</button><button class="action-btn" data-translate="no" onclick="selectTranslate('no')">EN</button></div>
<div id="timerOptions" class="sub-options"><button class="action-btn active" data-timer="0" onclick="selectTimer(0)">تثبيت</button><button class="action-btn" data-timer="5" onclick="selectTimer(5)">5s</button><button class="action-btn" data-timer="10" onclick="selectTimer(10)">10s</button></div>
</div>

<div class="card"><div class="card-title"><i class="fas fa-layer-group"></i> الأجزاء المختارة</div><div id="section-list" class="section-list"></div>
<div id="section-explanation"><div class="explain-header"><h3 id="explain-title"></h3><div class="explain-controls"><button class="lang-btn active" data-lang="ar" onclick="setExplainLang('ar')">🇪🇬 عربي</button><button class="lang-btn" data-lang="en" onclick="setExplainLang('en')">🇬🇧 English</button><button class="close-explain" onclick="closeExplanation()"><i class="fas fa-times"></i></button></div></div><div id="explain-text" class="ar"></div></div></div>

<button class="big-btn" onclick="startQuiz()"><i class="fas fa-play"></i> أبداً المذاكرة</button>

<div class="card" id="progressCard"><div class="card-title"><i class="fas fa-chart-line"></i> تقدمك</div>
<div class="progress-stats"><div class="progress-ring"><svg viewBox="0 0 70 70"><circle class="bg" cx="35" cy="35" r="28"/><circle class="fg" id="progressCircle" cx="35" cy="35" r="28" stroke-dashoffset="176"/></svg><div class="center-text" id="progressPercent">0<small>%</small></div></div>
<div class="stats-row" style="flex:1;margin:0;"><div class="stat"><div class="num" id="statAttempted">0</div><div class="lbl">تم حله</div></div><div class="stat"><div class="num" id="statCorrect">0</div><div class="lbl">صح</div></div><div class="stat"><div class="num" id="statWrong">0</div><div class="lbl">غلط</div></div></div></div>
<div class="weak-link" id="weakLink" onclick="startWeakSectionQuiz()"><i class="fas fa-lightbulb"></i> أضعف نقطة: <span id="weakSectionName">-</span> (<span id="weakSectionRate">0%</span>)</div>
<div class="action-row-bottom"><button class="big-btn warn" onclick="reviewMistakes()"><i class="fas fa-undo-alt"></i> راجع أخطائي</button><button class="big-btn secondary" onclick="resetProgress()"><i class="fas fa-trash-alt"></i> تصفير</button></div></div>
</div>

  {

    questions:[
      {num:1,en:"Never change a test answer unless you have a good reason for doing so.",ar:"لا تغير إجابة اختبار أبداً إلا إذا كان لديك سبب وجيه.",options:[{en:"A. budget",ar:"أ. ميزانية",correct:false},{en:"B. justification",ar:"ب. مبرر",correct:true},{en:"C. tutor",ar:"ج. مدرس خصوصي",correct:false}],explain_ar:"'Justification' تعني سببًا أو مبررًا."},
      {num:2,en:"If you have time, check over your exam before you turn it in.",ar:"إذا كان لديك وقت، راجع امتحانك قبل أن تسلمه.",options:[{en:"A. review",ar:"أ. مراجعة",correct:true},{en:"B. revise",ar:"ب. تنقيح",correct:false},{en:"C. add check marks",ar:"ج. إضافة علامات",correct:false}],explain_ar:"'Check over' تعني مراجعة سريعة."},
      {num:3,en:"Skillful test-takers know how to budget their time.",ar:"المختبرون المهرة يعرفون كيف يديرون وقتهم.",options:[{en:"A. equate time with money",ar:"أ. يساوون الوقت بالمال",correct:false},{en:"B. work very quickly",ar:"ب. يعملون بسرعة شديدة",correct:false},{en:"C. plan how to best use",ar:"ج. يخططون لكيفية الاستخدام الأمثل",correct:true}],explain_ar:"'Budget their time' تعني تخطيط الوقت."},
      {num:4,en:"Paraphrasing a test question sometimes helps you to understand it better.",ar:"إعادة صياغة سؤال الاختبار تساعد أحيانًا على فهمه بشكل أفضل.",options:[{en:"A. reading it aloud",ar:"أ. قراءته بصوت عالٍ",correct:false},{en:"B. restating it in your own words",ar:"ب. إعادة صياغته بكلماتك الخاصة",correct:true},{en:"C. reading it backward",ar:"ج. قراءته بالعكس",correct:false}],explain_ar:"'Paraphrasing' تعني إعادة الصياغة."},
      {num:5,en:"Employing certain strategies can help you get better test grades.",ar:"استخدام استراتيجيات معينة يمكن أن يساعدك في الحصول على درجات أفضل.",options:[{en:"A. techniques used to accomplish",ar:"أ. تقنيات تستخدم لتحقيق",correct:true},{en:"B. studying during peak hours",ar:"ب. المذاكرة في ساعات الذروة",correct:false},{en:"C. hiring a tutor to coach you",ar:"ج. توظيف مدرس لتدريبك",correct:false}],explain_ar:"'Employing' هنا تعني استخدام."},
      {num:6,en:"Severe frustration and stress can result in stomach ulcers.",ar:"الإحباط الشديد والإجهاد يمكن أن يؤديان إلى قرحة المعدة.",options:[{en:"A. violent tremors",ar:"أ. ارتجاف عنيف",correct:false},{en:"B. open sores",ar:"ب. تقرحات مفتوحة",correct:true},{en:"C. dull aches",ar:"ج. آلام خفيفة",correct:false}],explain_ar:"'Ulcers' هي تقرحات."},
      {num:7,en:"Phrases such as 'simmer down' and 'blow your top' are examples of",ar:"عبارات مثل 'اهدأ' و 'انفجر غضبًا' هي أمثلة على",options:[{en:"A. figurative language",ar:"أ. لغة مجازية",correct:true},{en:"B. bad grammar",ar:"ب. قواعد نحوية سيئة",correct:false},{en:"C. formal speech",ar:"ج. كلام رسمي",correct:false}],explain_ar:"هذه تعبيرات مجازية وليست حرفية."},
      {num:8,en:"Caffeine and alcohol can play a big part in uncontrolled anger.",ar:"الكافيين والكحول يمكن أن يلعبا دورًا كبيرًا في الغضب غير المسيطر عليه.",options:[{en:"A. food groups",ar:"أ. مجموعات غذائية",correct:false},{en:"B. legally prohibited",ar:"ب. محظورة قانونيًا",correct:false},{en:"C. chemical substances",ar:"ج. مواد كيميائية",correct:true}],explain_ar:"الكافيين والكحول مواد كيميائية."},
      {num:9,en:"A person who is suffering from anxiety feels",ar:"الشخص الذي يعاني من القلق يشعر",options:[{en:"A. distressed, nervous",ar:"أ. منزعج، عصبي",correct:true},{en:"B. bored, drowsy",ar:"ب. ملل، نعاس",correct:false},{en:"C. confident, sure",ar:"ج. واثق، متأكد",correct:false}],explain_ar:"القلق يسبب التوتر والانزعاج."},
      {num:10,en:"A behavior that is consistently repeated without thinking about it has become",ar:"السلوك الذي يتكرر باستمرار دون تفكير أصبح",options:[{en:"A. expert",ar:"أ. خبير",correct:false},{en:"B. incurable",ar:"ب. غير قابل للشفاء",correct:false},{en:"C. habitual",ar:"ج. معتاد",correct:true}],explain_ar:"'Habitual' يعني معتاد أو اعتيادي."},
      {num:11,en:"Gary got raked over the coals by the shift supervisor.",ar:"تعرض غاري لتوبيخ شديد من مشرف الوردية.",options:[{en:"A. praised",ar:"أ. مُدح",correct:false},{en:"B. warned",ar:"ب. حُذر",correct:false},{en:"C. scolded",ar:"ج. توبيخ",correct:true}],explain_ar:"'Raked over the coals' تعني توبيخ شديد."},
      {num:12,en:"Amy made the all-star team by the seat of her pants.",ar:"انضمت إيمي لفريق النجوم بالصدفة والمهارة القليلة.",options:[{en:"A. by sheer luck and little skill",ar:"أ. بالصدفة المحضة ومهارة قليلة",correct:true},{en:"B. by warming the bench",ar:"ب. بالجلوس على دكة الاحتياط",correct:false},{en:"C. in spite of falling",ar:"ج. رغم السقوط",correct:false}],explain_ar:"التعبير يعني بالصدفة والحظ."},
      {num:13,en:"We decided to go out on the spur of the moment.",ar:"قررنا الخروج فجأة.",options:[{en:"A. suddenly",ar:"أ. فجأة",correct:true},{en:"B. under pressure",ar:"ب. تحت ضغط",correct:false},{en:"C. arrive early",ar:"ج. الوصول مبكرًا",correct:false}],explain_ar:"'On the spur of the moment' تعني بشكل عفوي وفجائي."},
      {num:14,en:"Would a friend try to lead you down the garden path?",ar:"هل يمكن لصديق أن يحاول خداعك؟",options:[{en:"A. disappoint you",ar:"أ. يخيب ظنك",correct:false},{en:"B. deceive you",ar:"ب. يخدعك",correct:true},{en:"C. surprise you",ar:"ج. يفاجئك",correct:false}],explain_ar:"'Lead down the garden path' تعني خداع أو تضليل."},
      {num:15,en:"Some very successful people were born on the wrong side of the tracks.",ar:"بعض الأشخاص الناجحين جدًا وُلدوا في فقر.",options:[{en:"A. in small towns",ar:"أ. في بلدات صغيرة",correct:false},{en:"B. into poverty",ar:"ب. في فقر",correct:true},{en:"C. to beat the odds",ar:"ج. لتحدي الصعاب",correct:false}],explain_ar:"التعبير يعني الولادة في منطقة فقيرة."},
      {num:16,en:"That rookie can't hold a candle to the seasoned veteran.",ar:"ذلك المبتدئ لا يمكن مقارنته بالمحارب القديم.",options:[{en:"A. be as skillful and powerful",ar:"أ. أن يكون بنفس المهارة والقوة",correct:true},{en:"B. have confidence and trust in",ar:"ب. أن يثق ويعتمد على",correct:false},{en:"C. earn as much money",ar:"ج. يكسب نفس المال",correct:false}],explain_ar:"'Can't hold a candle to' تعني لا يقارن بـ."},
      {num:17,en:"We'll be all right as long as no one rocks the boat.",ar:"سنكون بخير طالما لا أحد يسبب المتاعب.",options:[{en:"A. gets nervous",ar:"أ. يصبح عصبيًا",correct:false},{en:"B. causes trouble",ar:"ب. يسبب المتاعب",correct:true},{en:"C. makes a mistake",ar:"ج. يرتكب خطأ",correct:false}],explain_ar:"'Rocks the boat' تعني يسبب المشاكل."},
      {num:18,en:"Instead of using a prepared mix, she made that cake from scratch.",ar:"بدلاً من استخدام خليط جاهز، صنعت الكعكة من الصفر.",options:[{en:"A. over the campfire",ar:"أ. على نار المخيم",correct:false},{en:"B. with professional help",ar:"ب. بمساعدة محترف",correct:false},{en:"C. using basic ingredients",ar:"ج. باستخدام مكونات أساسية",correct:true}],explain_ar:"'From scratch' تعني من البداية باستخدام مكونات خام."},
      {num:19,en:"The Downtown Housing Consortium works to provide shelter for the homeless.",ar:"يعمل اتحاد الإسكان في وسط المدينة لتوفير مأوى للمشردين.",options:[{en:"A. partnership of several organizations",ar:"أ. شراكة بين عدة منظمات",correct:true},{en:"B. meeting of church officials",ar:"ب. اجتماع مسؤولي الكنيسة",correct:false},{en:"C. cluster of apartment buildings",ar:"ج. مجموعة من المباني السكنية",correct:false}],explain_ar:"'Consortium' تعني اتحاد أو شراكة."},
      {num:20,en:"Tutors are needed to help people learn to read better.",ar:"هناك حاجة لمدرسين خصوصيين لمساعدة الناس على تعلم القراءة بشكل أفضل.",options:[{en:"A. financial sponsors",ar:"أ. رعاة ماليون",correct:false},{en:"B. private teachers",ar:"ب. مدرسون خصوصيون",correct:true},{en:"C. trumpet players",ar:"ج. عازفو البوق",correct:false}],explain_ar:"'Tutors' هم مدرسون خصوصيون."},
      {num:21,en:"Docents are needed at the art museum.",ar:"هناك حاجة لمرشدين في متحف الفن.",options:[{en:"A. maintenance workers",ar:"أ. عمال صيانة",correct:false},{en:"B. gift shop clerks",ar:"ب. بائعي متجر الهدايا",correct:false},{en:"C. tour guides and lecturers",ar:"ج. مرشدون سياحيون ومحاضرون",correct:true}],explain_ar:"'Docents' هم مرشدون متطوعون في المتاحف."},
      {num:22,en:"I support the Food Bank because it is a worthy cause.",ar:"أنا أدعم بنك الطعام لأنه قضية تستحق الدعم.",options:[{en:"A. has very little funding",ar:"أ. لديه تمويل قليل جدًا",correct:false},{en:"B. is worth a fortune",ar:"ب. يساوي ثروة",correct:false},{en:"C. deserves help for good work",ar:"ج. يستحق المساعدة لعمل جيد",correct:true}],explain_ar:"'Worthy cause' تعني قضية تستحق الدعم."},
      {num:23,en:"You must make a six-month commitment to volunteer as a tutor.",ar:"يجب عليك الالتزام لمدة ستة أشهر للتطوع كمدرس خصوصي.",options:[{en:"A. donate your money",ar:"أ. التبرع بمالك",correct:false},{en:"B. promise or pledge",ar:"ب. وعد أو تعهد",correct:true},{en:"C. sign a binding contract",ar:"ج. توقيع عقد ملزم",correct:false}],explain_ar:"'Commitment' تعني التزام أو تعهد."},
      {num:24,en:"Commercially available foods are",ar:"الأطعمة المتاحة تجاريًا هي",options:[{en:"A. better than homemade",ar:"أ. أفضل من المصنوع منزليًا",correct:false},{en:"B. advertised on television",ar:"ب. معلن عنها على التلفزيون",correct:false},{en:"C. for sale in stores",ar:"ج. معروضة للبيع في المتاجر",correct:true}],explain_ar:"'Commercially available' تعني متاحة للبيع في الأسواق."},
      {num:25,en:"The texture of a perfect biscuit should be",ar:"قوام البسكويت المثالي يجب أن يكون",options:[{en:"A. rough and grainy",ar:"أ. خشن وحبيبي",correct:false},{en:"B. dense and rich",ar:"ب. كثيف وغني",correct:false},{en:"C. light and airy",ar:"ج. خفيف وهش",correct:true}],explain_ar:"القوام المثالي للبسكويت هو خفيف وهش."},
      {num:26,en:"The cook will knead the dough by",ar:"سيعجن الطاهي العجين عن طريق",options:[{en:"A. baking it homemade",ar:"أ. خبزه في المنزل",correct:false},{en:"B. pressing, rolling, and squeezing it",ar:"ب. الضغط، والدحرجة، والضغط عليه",correct:true},{en:"C. allowing it to rise",ar:"ج. تركه ليتخمر",correct:false}],explain_ar:"'Knead' تعني عجن العجين."},
      {num:27,en:"An insurance company considers your issue age to be",ar:"تعتبر شركة التأمين عمر إصدارك",options:[{en:"A. your age at death",ar:"أ. عمرك عند الوفاة",correct:false},{en:"B. the date you were born",ar:"ب. تاريخ ميلادك",correct:false},{en:"C. your age when the policy is written",ar:"ج. عمرك عند كتابة الوثيقة",correct:true}],explain_ar:"'Issue age' هو العمر عند إصدار البوليصة."},
      {num:28,en:"Insurance rates are",ar:"أسعار التأمين هي",options:[{en:"A. prices charged per unit of coverage",ar:"أ. الأسعار المفروضة لكل وحدة تغطية",correct:true},{en:"B. also called death benefits",ar:"ب. تسمى أيضًا مزايا الوفاة",correct:false},{en:"C. subject to underwriting",ar:"ج. تخضع للاكتتاب",correct:false}],explain_ar:"'Rates' هي الأسعار."},
      {num:29,en:"Payments made semiannually are paid",ar:"المدفوعات التي تتم نصف سنويًا تُدفع",options:[{en:"A. every two years",ar:"أ. كل سنتين",correct:false},{en:"B. one-half at a time",ar:"ب. نصفًا في المرة",correct:false},{en:"C. twice a year",ar:"ج. مرتين في السنة",correct:true}],explain_ar:"'Semiannually' تعني نصف سنويًا (مرتين في السنة)."},
      {num:30,en:"conversation",ar:"محادثة",options:[{en:"A. حوار",ar:"أ. حوار",correct:true},{en:"B. تحول",ar:"ب. تحول",correct:false},{en:"C. صراع",ar:"ج. صراع",correct:false}],explain_ar:"'Conversation' تعني محادثة أو حوار."},
      {num:31,en:"deed",ar:"عمل/فعل",options:[{en:"A. ميت",ar:"أ. ميت",correct:false},{en:"B. عمل/فعل",ar:"ب. عمل/فعل",correct:true},{en:"C. حي",ar:"ج. حي",correct:false}],explain_ar:"'Deed' تعني عمل أو فعل."},
      {num:32,en:"rule",ar:"قاعدة/مبدأ",options:[{en:"A. قاعدة/مبدأ",ar:"أ. قاعدة/مبدأ",correct:true},{en:"B. دور",ar:"ب. دور",correct:false},{en:"C. قرار",ar:"ج. قرار",correct:false}],explain_ar:"'Rule' تعني قاعدة."},
      {num:33,en:"hobby",ar:"هواية",options:[{en:"A. هواية",ar:"أ. هواية",correct:true},{en:"B. سعيد",ar:"ب. سعيد",correct:false},{en:"C. حزين",ar:"ج. حزين",correct:false}],explain_ar:"'Hobby' تعني هواية."},
      {num:34,en:"millennium",ar:"ألفية",options:[{en:"A. مليونية",ar:"أ. مليونية",correct:false},{en:"B. ألفية",ar:"ب. ألفية",correct:true},{en:"C. سنوية",ar:"ج. سنوية",correct:false}],explain_ar:"'Millennium' تعني ألفية (1000 سنة)."},
      {num:35,en:"The coach, along with the players, ______ the decision.",ar:"المدرب، مع اللاعبين، ______ القرار.",options:[{en:"A. protests",ar:"أ. يحتج",correct:true},{en:"B. protest",ar:"ب. يحتجون",correct:false},{en:"C. protesting",ar:"ج. يحتج",correct:false}],explain_ar:"الفعل يوافق 'coach' (مفرد) لذا يستخدم protests."}
    ]
  },

      {num:3,en:"We discussed the multiple literary ______ within the text.",ar:"ناقشنا التلميحات الأدبية المتعددة داخل النص.",options:[{en:"A. illusions",ar:"أ. أوهام",correct:false},{en:"B. allusions",ar:"ب. تلميحات",correct:true},{en:"C. delusions",ar:"ج. أوهام",correct:false}],explain_ar:"'Allusions' تعني تلميحات أدبية."},
      {num:4,en:"______ me and you, I think Kallie won the contest.",ar:"______ أنا وأنت، أعتقد أن كالي فازت بالمسابقة.",options:[{en:"A. Between",ar:"أ. بين (لشخصين)",correct:true},{en:"B. Among",ar:"ب. بين (لأكثر من اثنين)",correct:false},{en:"C. Through",ar:"ج. من خلال",correct:false}],explain_ar:"'Between' تستخدم لشخصين."},
      {num:5,en:"She had too ______ sweaters in her closet.",ar:"كان لديها الكثير من السترات في خزانتها.",options:[{en:"A. many",ar:"أ. الكثير (للعدد)",correct:true},{en:"B. much",ar:"ب. الكثير (للكمية)",correct:false},{en:"C. less",ar:"ج. أقل",correct:false}],explain_ar:"'Sweaters' اسم معدود -> many."},
      {num:6,en:"Alex was ______ excited to sleep.",ar:"كان أليكس متحمسًا جدًا لدرجة أنه لم يستطع النوم.",options:[{en:"A. too",ar:"أ. جدًا (لدرجة)",correct:true},{en:"B. two",ar:"ب. اثنان",correct:false},{en:"C. to",ar:"ج. إلى",correct:false}],explain_ar:"'Too' تعني أكثر من اللازم."},
      {num:7,en:"______ going to the amusement park tomorrow.",ar:"______ سوف يذهبون إلى مدينة الملاهي غدًا.",options:[{en:"A. Their",ar:"أ. ملكهم",correct:false},{en:"B. There",ar:"ب. هناك",correct:false},{en:"C. They're",ar:"ج. هم",correct:true}],explain_ar:"'They're' هي اختصار They are."},
      {num:8,en:"The sugar had a negative ______ on the science experiment.",ar:"كان للسكر تأثير سلبي على تجربة العلوم.",options:[{en:"A. effect",ar:"أ. تأثير (اسم)",correct:true},{en:"B. affect",ar:"ب. يؤثر (فعل)",correct:false},{en:"C. affected",ar:"ج. أثر (ماضي)",correct:false}],explain_ar:"'Effect' اسم يعني تأثير."},
      {num:9,en:"Nicole has ______ shoes than Sara.",ar:"نيكول لديها أحذية ______ من سارة.",options:[{en:"A. few",ar:"أ. قليل",correct:false},{en:"B. fewer",ar:"ب. أقل (للعدد)",correct:true},{en:"C. less",ar:"ج. أقل (للكمية)",correct:false}],explain_ar:"'Shoes' معدود -> fewer."},
      {num:10,en:"The gas prices continue to ______.",ar:"أسعار البنزين تستمر في ______.",options:[{en:"A. rice",ar:"أ. أرز",correct:false},{en:"B. rise",ar:"ب. الارتفاع",correct:true},{en:"C. raise",ar:"ج. رفع",correct:false}],explain_ar:"'Rise' يعني يرتفع (لغير المتعدي)."},
      {num:11,en:"Michael ______ the picture for his mother.",ar:"مايكل ______ الصورة لأمه.",options:[{en:"A. hanged",ar:"أ. شنق",correct:false},{en:"B. hang",ar:"ب. يعلق",correct:false},{en:"C. hung",ar:"ج. علق",correct:true}],explain_ar:"'Hung' هو الماضي من hang بمعنى علق (صورة)."},
      {num:12,en:"John scored higher on the exam ______ I did.",ar:"سجل جون أعلى في الامتحان ______ أنا.",options:[{en:"A. then",ar:"أ. ثم",correct:false},{en:"B. that",ar:"ب. أن",correct:false},{en:"C. than",ar:"ج. من",correct:true}],explain_ar:"'Than' تستخدم للمقارنة."},
      {num:13,en:"______ wants to go to the mall tonight?",ar:"______ يريد الذهاب إلى المركز التجاري الليلة؟",options:[{en:"A. Whose",ar:"أ. لمن",correct:false},{en:"B. Who",ar:"ب. من (فاعل)",correct:true},{en:"C. Whom",ar:"ج. من (مفعول به)",correct:false}],explain_ar:"'Who' فاعل."},
      {num:14,en:"Haley did not mean to ______ that Jenny was to blame.",ar:"لم تقصد هالي أن ______ أن جيني هي المسؤولة.",options:[{en:"A. infer",ar:"أ. استنتاج",correct:false},{en:"B. imply",ar:"ب. التلميح",correct:true},{en:"C. apply",ar:"ج. تطبيق",correct:false}],explain_ar:"'Imply' تعني تلميح (المتكلم)."},
      {num:15,en:"John had ______ travel time because he lives closer to the airport.",ar:"كان لدى جون وقت سفر ______ لأنه يعيش بالقرب من المطار.",options:[{en:"A. fewer",ar:"أ. أقل (للعدد)",correct:false},{en:"B. few",ar:"ب. قليل",correct:false},{en:"C. less",ar:"ج. أقل (للكمية)",correct:true}],explain_ar:"'Travel time' غير معدود -> less."},
      {num:16,en:"______ watch is this on the counter?",ar:"______ ساعة هذه على المنضدة؟",options:[{en:"A. Whom",ar:"أ. من (مفعول)",correct:false},{en:"B. Whose",ar:"ب. لمن",correct:true},{en:"C. Who's",ar:"ج. من يكون",correct:false}],explain_ar:"'Whose' تعني لمن (ملكية)."},
      {num:17,en:"I am going to ______ down for an hour.",ar:"سأضطجع لمدة ساعة.",options:[{en:"A. laid",ar:"أ. وضع (ماضي)",correct:false},{en:"B. lay",ar:"ب. يضع",correct:false},{en:"C. lie",ar:"ج. يضطجع",correct:true}],explain_ar:"'Lie down' تعني اضطجع."},
      {num:18,en:"The disappearing penny was simply an optical ______.",ar:"البنس المختفي كان مجرد ______ بصري.",options:[{en:"A. allusion",ar:"أ. تلميح",correct:false},{en:"B. illusion",ar:"ب. وهم",correct:true},{en:"C. delusion",ar:"ج. وهم (مرضي)",correct:false}],explain_ar:"'Optical illusion' خداع بصري."},
      {num:19,en:"The book is on the table over ______.",ar:"الكتاب على الطاولة هناك.",options:[{en:"A. they're",ar:"أ. هم",correct:false},{en:"B. their",ar:"ب. ملكهم",correct:false},{en:"C. there",ar:"ج. هناك",correct:true}],explain_ar:"'There' تعني هناك."},
      {num:20,en:"From your words, I can ______ that you think he is guilty.",ar:"من كلماتك، يمكنني ______ أنك تعتقد أنه مذنب.",options:[{en:"A. infer",ar:"أ. استنتاج",correct:true},{en:"B. imply",ar:"ب. التلميح",correct:false},{en:"C. apply",ar:"ج. تطبيق",correct:false}],explain_ar:"'Infer' تعني استنتاج (المستمع)."},
      {num:21,en:"The weather greatly ______ the outcome of the race.",ar:"أثر الطقس بشكل كبير على نتيجة السباق.",options:[{en:"A. effected",ar:"أ. أحدث",correct:false},{en:"B. effect",ar:"ب. تأثير",correct:false},{en:"C. affected",ar:"ج. أثر (فعل)",correct:true}],explain_ar:"'Affected' فعل يعني أثر على."},
      {num:22,en:"The prisoner was ______ last night.",ar:"تم شنق السجين الليلة الماضية.",options:[{en:"A. hanged",ar:"أ. شنق (إعدام)",correct:true},{en:"B. hang",ar:"ب. يعلق",correct:false},{en:"C. hung",ar:"ج. علق",correct:false}],explain_ar:"'Hanged' تستخدم للإعدام شنقًا."},
      {num:23,en:"When someone does a favor for you, ______ must be thanked.",ar:"عندما يقوم شخص بمعروف لك، يجب شكر ______.",options:[{en:"A. we",ar:"أ. نحن",correct:false},{en:"B. they",ar:"ب. هم",correct:false},{en:"C. he or she",ar:"ج. هو أو هي",correct:true}],explain_ar:"'Someone' مفرد -> he or she."},
      {num:24,en:"The audience clapped and cheered to communicate ______ approval.",ar:"صفق الجمهور وهتف لإيصال ______ موافقته.",options:[{en:"A. their",ar:"أ. ملكهم",correct: true},{en:"B. they",ar:"ب. هم",correct:false},{en:"C. its",ar:"ج. ملكه (مفرد)",correct: false}],explain_ar:".علشان جمع مش مفرد."},
      {num:25,en:"No one in the maze could find ______ way out.",ar:"لم يستطع أحد في المتاهة إيجاد ______ مخرج.",options:[{en:"A. their",ar:"أ. ملكهم",correct:false},{en:"B. his or her",ar:"ب. ملكه أو ملكها",correct:true},{en:"C. its",ar:"ج. ملكه",correct:false}],explain_ar:"'No one' مفرد -> his or her."},
      {num:26,en:"The corporation has decided to move ______ headquarters to Hawaii.",ar:"قررت الشركة نقل ______ مقرها إلى هاواي.",options:[{en:"A. their",ar:"أ. ملكهم",correct:false},{en:"B. his or her",ar:"ب. ملكه أو ملكها",correct:false},{en:"C. its",ar:"ج. ملكها",correct:true}],explain_ar:"'Corporation' مفرد -> its."},
      {num:27,en:"Everyone wearing high heels knew that ______ had made a bad shoe choice.",ar:"كل من ترتدي الكعب العالي عرفت أن ______ ارتكبت خطأ في اختيار الحذاء.",options:[{en:"A. their",ar:"أ. ملكهم",correct:false},{en:"B. they",ar:"ب. هم",correct:false},{en:"C. she",ar:"ج. هي",correct:true}],explain_ar:"السياق يشير إلى النساء (high heels) -> she."},
      {num:28,en:"Ricardo is one of those people who like to do everything ______.",ar:"ريكاردو هو واحد من أولئك الذين يحبون فعل كل شيء ______.",options:[{en:"A. herself",ar:"أ. بنفسها",correct:false},{en:"B. themselves",ar:"ب. بأنفسهم",correct: true},{en:"C. himself",ar:"ج. بنفسه",correct: false}],explain_ar:"الجملة جمع مش مفرد."},
      {num:29,en:"Lynn's name was on the list of people ______ still owed money.",ar:"كان اسم لين على قائمة الأشخاص ______ لا يزالون مدينين بالمال.",options:[{en:"A. which",ar:"أ. الذي (لغير العاقل)",correct:false},{en:"B. who",ar:"ب. الذين (للعاقل)",correct:true},{en:"C. that",ar:"ج. الذي (للعاقل وغير العاقل)",correct:false}],explain_ar:"'People' عاقل -> who."},
      {num:30,en:"The drill sergeant required perfection from everyone and everything ______ was part of his platoon.",ar:"طلب الرقيب المثالية من كل شخص وكل شيء ______ كان جزءًا من فصيلته.",options:[{en:"A. who",ar:"أ. الذي (للعاقل)",correct:false},{en:"B. that",ar:"ب. الذي (للعاقل وغير العاقل)",correct:true},{en:"C. which",ar:"ج. الذي (لغير العاقل)",correct:false}],explain_ar:"'Everyone and everything' -> that."},
      {num:31,en:"Ellen is the only one in the whole class who can laugh at ______ after making a mistake.",ar:"إلين هي الوحيدة في الفصل التي تستطيع الضحك على ______ بعد ارتكاب خطأ.",options:[{en:"A. himself or herself",ar:"أ. نفسه أو نفسها",correct:false},{en:"B. themselves",ar:"ب. أنفسهم",correct:false},{en:"C. herself",ar:"ج. نفسها",correct:true}],explain_ar:"تعود على Ellen (مفرد مؤنث) -> herself."},
      {num:32,en:"Both of my parents are conscientious about taking care of ______ health.",ar:"كلا والديّ حريصان على الاهتمام بصحة ______.",options:[{en:"A. his or her",ar:"أ. صحته أو صحتها",correct:false},{en:"B. their",ar:"ب. صحتهم",correct:true},{en:"C. him",ar:"ج. له",correct:false}],explain_ar:"'Both' جمع -> their."},
      {num:33,en:"The team faces ______ toughest challenge this Friday.",ar:"الفريق يواجه ______ تحدٍ أصعب هذا الجمعة.",options:[{en:"A. its",ar:"أ. تحديه (مفرد)",correct:true},{en:"B. their",ar:"ب. تحديهم",correct:false},{en:"C. it's",ar:"ج. إنه",correct:false}],explain_ar:"'Team' مفرد -> its."},
      {num:34,en:"Neither of the men wanted to carry ______ wife's purse while she shopped.",ar:"لم يرد أي من الرجال حمل حقيبة ______ زوجته أثناء تسوقها.",options:[{en:"A. his",ar:"أ. زوجته",correct:true},{en:"B. her",ar:"ب. زوجتها",correct:false},{en:"C. their",ar:"ج. زوجاتهم",correct:false}],explain_ar:"كل رجل له زوجته -> his."},
      {num:35,en:"Either John or Ralph will win the contest and see ______ hard work pay off.",ar:"إما جون أو رالف سيفوز بالمسابقة ويرى ______ عمله الجاد يؤتي ثماره.",options:[{en:"A. his",ar:"أ. عمله",correct:true},{en:"B. him",ar:"ب. له",correct:false},{en:"C. their",ar:"ج. عملهم",correct:false}],explain_ar:"Either ... or -> أقرب (John or Ralph) -> his."},
      {num:36,en:"A parent should read to ______ child every day.",ar:"يجب على الوالدين أن يقرآ لطفلهما كل يوم.",options:[{en:"A. you",ar:"أ. لك",correct:false},{en:"B. their",ar:"ب. طفلهم",correct:false},{en:"C. his or her",ar:"ج. طفله أو طفلتها",correct:true}],explain_ar:"'A parent' مفرد -> his or her."},
      {num:37,en:"Either of the mothers will be willing to tell you ______ story.",ar:"أي من الأمهات ستكون على استعداد لإخبارك ______ قصة.",options:[{en:"A. his",ar:"أ. قصته",correct:false},{en:"B. her",ar:"ب. قصتها",correct:true},{en:"C. their",ar:"ج. قصتهم",correct:false}],explain_ar:"'Mothers' مؤنث -> her."},
      {num:38,en:"The writer and the artist have joined forces to produce ______ next book.",ar:"انضم الكاتب والفنان معًا لإنتاج ______ كتابهما القادم.",options:[{en:"A. his or her",ar:"أ. كتابه أو كتابها",correct:false},{en:"B. their",ar:"ب. كتابهما",correct:true},{en:"C. his",ar:"ج. كتابه",correct:false}],explain_ar:"اثنان -> their."},
      {num:39,en:"Neither George nor his brothers have been able to locate ______ grandmother's jewelry box.",ar:"لم يتمكن جورج ولا إخوته من تحديد موقع علبة مجوهرات ______ جدتهم.",options:[{en:"A. his",ar:"أ. جدته",correct:false},{en:"B. their",ar:"ب. جدتهم",correct:true},{en:"C. his or her",ar:"ج. جدته أو جدتها",correct:false}],explain_ar:"الأقرب 'brothers' جمع -> their."},
      {num:40,en:"The price of those shoes ______ too high.",ar:"سعر تلك الأحذية ______ مرتفع جدًا.",options:[{en:"A. is",ar:"أ. هو",correct: true},{en:"B. are",ar:"ب. هم",correct: false},{en:"C. am",ar:"ج. أنا",correct:false}],explain_ar:"الفعل يوافق 'price' (مفرد) -> is."},
      {num:41,en:"Neither of the women ______ ready at this time.",ar:"لا واحدة من النساء ______ مستعدة الآن.",options:[{en:"A. is",ar:"أ. هي",correct:true},{en:"B. are",ar:"ب. هن",correct:false},{en:"C. am",ar:"ج. أنا",correct:false}],explain_ar:"'Neither of' يتبع مفرد -> is."}

  {

    nameEn:"Sentence Structure",
    sectionTotal:6,
    questions:[
      {num:1,en:"Choose the best topic sentence: I usually go skiing every weekend in the winter even though it is expensive. I love the feeling of flying down a mountain. The views are beautiful from the top of a mountain and along the trails. Even the danger of falling and getting hurt can't keep me away from the slopes on a winter day.",ar:"اختر الجملة الموضوعية المناسبة: عادةً ما أذهب للتزلج كل عطلة نهاية أسبوع في الشتاء رغم أنه مكلف. أحب شعور الانطلاق على الجبل. المناظر جميلة من قمة الجبل وعلى طول المسارات. حتى خطر السقوط والإصابة لا يمكن أن يبعدني عن المنحدرات في يوم شتوي.",options:[{en:"A. Skiing is expensive.",ar:"أ. التزلج مكلف.",correct:false},{en:"B. Skiing is my favourite sport.",ar:"ب. التزلج هو رياضتي المفضلة.",correct:true},{en:"C. Skiing is dangerous.",ar:"ج. التزلج خطير.",correct:false}],explain_ar:"الجملة الموضوعية تعبر عن الفكرة العامة وهي أن التزلج رياضة مفضلة."},
      {num:2,en:"Choose the best topic sentence: North Americans send cards for many occasions. They send cards to family and friends on birthdays and holidays. They also send thank-you cards, get well cards, graduation cards, and congratulation cards. It is very common to buy cards in stores and send them through the mail, but turning on the computer and sending cards over the Internet is also popular.",ar:"اختر الجملة الموضوعية المناسبة: يرسل أمريكا الشماليون بطاقات لمناسبات عديدة. يرسلون بطاقات للعائلة والأصدقاء في أعياد الميلاد والعطلات. كما يرسلون بطاقات شكر، وتهنئة بالشفاء، وتخرج، وتهنئة. من الشائع جدًا شراء البطاقات من المتاجر وإرسالها عبر البريد، ولكن تشغيل الكمبيوتر وإرسال البطاقات عبر الإنترنت شائع أيضًا.",options:[{en:"A. Sending cards is very popular in North America.",ar:"أ. إرسال البطاقات شائع جدًا في أمريكا الشمالية.",correct:true},{en:"B. Birthday cards are the most popular kind of card.",ar:"ب. بطاقات أعياد الميلاد هي الأكثر شيوعًا.",correct:false},{en:"C. It is important to send thank-you cards.",ar:"ج. من المهم إرسال بطاقات الشكر.",correct:false}],explain_ar:"الجملة تعمم عن ظاهرة إرسال البطاقات."},
      {num:3,en:"Choose the best topic sentence: I enjoy summer sports like water skiing and baseball. The weather is usually sunny and hot, so I can go to the beach almost every day. Gardening is my hobby and I spend many summer days working in my garden. Unfortunately, the days pass too quickly in summer.",ar:"اختر الجملة الموضوعية المناسبة: أستمتع بالرياضات الصيفية مثل التزلج على الماء والبيسبول. الطقس عادة مشمس وحار، لذا يمكنني الذهاب إلى الشاطئ كل يوم تقريبًا. البستنة هي هوايتي وأقضي أيامًا صيفية عديدة في حديقتي. لسوء الحظ، تمر أيام الصيف بسرعة كبيرة.",options:[{en:"A. I like to garden in summer.",ar:"أ. أحب البستنة في الصيف.",correct:false},{en:"B. Summer is my favourite season.",ar:"ب. الصيف هو فصلي المفضل.",correct:true},{en:"C. Summer is too short.",ar:"ج. الصيف قصير جدًا.",correct:false}],explain_ar:"الجملة تعبر عن حب الصيف بشكل عام."},
      {num:4,en:"Choose the best topic sentence: First of all, we need money to repair old roads and build new roads. We also need more to pay teachers' salaries and to pay for services such as trash collection. Finally, more tax money is needed to give financial help to the poor citizens of the city. It is clear that the city will have serious problems if taxes are not raised soon.",ar:"اختر الجملة الموضوعية المناسبة: أولاً، نحتاج إلى المال لإصلاح الطرق القديمة وبناء طرق جديدة. نحتاج أيضًا إلى المزيد لدفع رواتب المعلمين ولدفع تكاليف خدمات مثل جمع القمامة. أخيرًا، هناك حاجة إلى المزيد من أموال الضرائب لتقديم مساعدة مالية للمواطنين الفقراء في المدينة. من الواضح أن المدينة ستواجه مشاكل خطيرة إذا لم يتم رفع الضرائب قريبًا.",options:[{en:"A. We should raise city taxes.",ar:"أ. يجب أن نرفع ضرائب المدينة.",correct:true},{en:"B. City taxes are too high.",ar:"ب. ضرائب المدينة مرتفعة جدًا.",correct:false},{en:"C. City taxes pay for new roads.",ar:"ج. ضرائب المدينة تدفع للطرق الجديدة.",correct:false}],explain_ar:"الجملة تدعم رفع الضرائب لحل المشاكل."},
      {num:5,en:"Choose the best topic sentence: For example, a person can have breakfast in New York, board an airplane, and have dinner in Paris. A businesswoman in London can instantly place an order with a factory in Hong Kong by sending a fax. Furthermore, a schoolboy in Tokyo can turn on a TV and watch a baseball game being played in Los Angeles.",ar:"اختر الجملة الموضوعية المناسبة: على سبيل المثال، يمكن للشخص أن يتناول الإفطار في نيويورك، ويصعد إلى طائرة، ويتناول العشاء في باريس. يمكن لسيدة أعمال في لندن أن تطلب فورًا من مصنع في هونغ كونغ بإرسال فاكس. علاوة على ذلك، يمكن لتلميذ في طوكيو تشغيل التلفزيون ومشاهدة مباراة بيسبول تُلعب في لوس أنجلوس.",options:[{en:"A. Airplanes have changed our lives.",ar:"أ. الطائرات غيرت حياتنا.",correct:false},{en:"B. Advances in technology have made the world seem smaller.",ar:"ب. التقدم التكنولوجي جعل العالم يبدو أصغر.",correct:true},{en:"C. The fax machine was an important invention.",ar:"ج. جهاز الفاكس كان اختراعًا مهمًا.",correct:false}],explain_ar:"الجملة تعبر عن تأثير التكنولوجيا في تقريب المسافات."},
      {num:6,en:"Choose the best topic sentence: One thing you must consider is the quality of the university's educational program. You also need to think about the school's size and location. Finally, you must be sure to consider the university's tuition to make sure you can afford to go to school there.",ar:"اختر الجملة الموضوعية المناسبة: شيء واحد يجب أن تضعه في اعتبارك هو جودة البرنامج التعليمي للجامعة. تحتاج أيضًا إلى التفكير في حجم المدرسة وموقعها. أخيرًا، يجب أن تتأكد من النظر في رسوم الجامعة لتتأكد من أنك تستطيع تحمل تكاليف الدراسة هناك.",options:[{en:"A. It is expensive to attend a university in the United States.",ar:"أ. الدراسة في جامعة في الولايات المتحدة مكلفة.",correct:false},{en:"B. There are several factors to consider when you choose a university to attend.",ar:"ب. هناك عدة عوامل يجب مراعاتها عند اختيار جامعة للالتحاق بها.",correct:true},{en:"C. You should consider getting a good education.",ar:"ج. يجب أن تفكر في الحصول على تعليم جيد.",correct:false}],explain_ar:"الجملة تلخص العوامل التي يجب مراعاتها."}
    ]
  },

// دالة فصل الأسئلة (اختياري عن صواب/خطأ) - نفس الكود السابق
// ======================================================================
function buildSeparateSections(originalBank) {
  const newBank = [];
  originalBank.forEach(sec => {
    const mcq = [];
    const tf = [];
    sec.questions.forEach(q => {
      if (q.isTF !== undefined && q.isTF !== null) {
        tf.push(q);
      } else {
        mcq.push(q);
      }
    });
    const renumber = (arr) => arr.map((q, idx) => ({ ...q, num: idx + 1 }));
    const mcqRenumbered = renumber(mcq);
    const tfRenumbered = renumber(tf);

    if (mcqRenumbered.length > 0) {
      newBank.push({
        name: sec.name + ' (اختياري)',
        nameEn: sec.nameEn + ' (MCQ)',
        originalName: sec.name,
        questions: mcqRenumbered
      });
    }
    if (tfRenumbered.length > 0) {
      newBank.push({
        name: sec.name + ' (صواب/خطأ)',
        nameEn: sec.nameEn + ' (True/False)',
        originalName: sec.name,
        questions: tfRenumbered
      });
    }
  });
  return newBank;
}

// ============ التعديل الأهم: دالة renderQuestion مع إصلاح وضع الاختبار ============
function renderQuestion(){
  const idx=state.currentIndex;
  const q=state.quizQuestions[idx];
  const st=state.questionStates[idx];
  state.answered=st.answered;
  state.selectedOptionIdx=st.selectedOption;
  const total=state.quizQuestions.length;
  document.getElementById('quiz-position').innerHTML=`<i class="fas fa-question-circle"></i> ${idx+1} / ${total}`;
  document.getElementById('quiz-score').innerHTML=`<i class="fas fa-check-circle" style="color:var(--success);"></i> ${state.correctCount} <i class="fas fa-times-circle" style="color:var(--danger);margin-right:4px;"></i> ${state.wrongCount}`;
  document.getElementById('progress-bar').style.width=((idx)/total*100)+'%';
  let tagText=`<i class="fas fa-tag"></i> ${q.sectionName}`;
  if(q.isTF)tagText+=` <span class="tf-badge">صواب / خطأ</span>`;
  document.getElementById('q-section-tag').innerHTML=tagText;
  const qEn=document.getElementById('q-en');
  wrapEnglishText(`${q.num}. ${q.en}`,qEn);
  const qAr=document.getElementById('q-ar');
  qAr.textContent=q.ar||'';
  qAr.style.display=state.showTranslation&&q.ar?'block':'none';
  const opts=document.getElementById('options');
  opts.innerHTML='';
  if(q.isTF){
    [{en:"True",ar:"صواب"},{en:"False",ar:"خطأ"}].forEach((opt,i)=>{
      const div=document.createElement('div');
      div.className='option';
      div.dataset.idx=i;
      const isCorrect=(i===0)?q.correct===true:q.correct===false;
      div.dataset.correct=isCorrect?'true':'false';
      const enDiv=document.createElement('div');
      enDiv.className='opt-en';
      wrapEnglishText(opt.en,enDiv);
      const arDiv=document.createElement('div');
      arDiv.className='opt-ar';
      arDiv.textContent=opt.ar||'';
      arDiv.style.display=state.showTranslation&&opt.ar?'block':'none';
      const mark=document.createElement('span');
      mark.className='mark';
      div.appendChild(enDiv);
      div.appendChild(arDiv);
      div.appendChild(mark);
      div.onclick=()=>onOptionClick(i);
      opts.appendChild(div);
    });
  }else{
    q.options.forEach((opt,i)=>{
      const div=document.createElement('div');
      div.className='option';
      div.dataset.idx=i;
      div.dataset.correct=opt.correct?'true':'false';
      const enDiv=document.createElement('div');
      enDiv.className='opt-en';
      wrapEnglishText(opt.en,enDiv);
      const arDiv=document.createElement('div');
      arDiv.className='opt-ar';
      arDiv.textContent=opt.ar||'';
      arDiv.style.display=state.showTranslation&&opt.ar?'block':'none';
      const mark=document.createElement('span');
      mark.className='mark';
      div.appendChild(enDiv);
      div.appendChild(arDiv);
      div.appendChild(mark);
      div.onclick=()=>onOptionClick(i);
      opts.appendChild(div);
    });
  }
  if(st.answered){
    const chosenIdxs=st.chosenIdxs;
    document.querySelectorAll('.option').forEach(el=>{
      const idxOpt=parseInt(el.dataset.idx);
      el.classList.add('disabled');
      const isCorrectOption=el.dataset.correct==='true';
      if(isCorrectOption){
        el.classList.add('correct');
        el.querySelector('.mark').textContent='✅';
      }else if(chosenIdxs.includes(idxOpt)){
        el.classList.add('wrong');
        el.querySelector('.mark').textContent='❌';
      }
      if(st.selectedOption===idxOpt)el.classList.add('selected');
    });
    const fb=document.getElementById('feedback');
    fb.classList.remove('hidden');
    fb.className='feedback-box '+(st.isCorrect?'correct':'wrong');
    let correctLabels='';
    if(q.isTF){
      correctLabels=q.correct?'True (صواب)':'False (خطأ)';
    }else{
      correctLabels=q.options.map((o,i)=>o.correct?o.en:null).filter(Boolean).join('، ');
    }
    fb.innerHTML=`<div class="fb-title">${st.isCorrect?'✅ صحيحة!':'❌ غلط'}</div>${!st.isCorrect?`<div><b>الصح:</b> ${correctLabels}</div>`:''}<div class="fb-explain">💡 ${q.explain_ar||''}</div>`;
  }else{
    document.getElementById('feedback').classList.add('hidden');
    document.getElementById('feedback').innerHTML='';
  }
  const nextBtn=document.getElementById('btn-next');
  const prevBtn=document.getElementById('btn-prev');
  prevBtn.disabled=(idx===0);
  const isLast=idx===total-1;

  // ======== إصلاح وضع الاختبار ========
  if(state.mode==='test'){
    // في وضع الاختبار: زر التالي يكون مفعلاً فقط إذا تم اختيار خيار
    nextBtn.disabled = (state.selectedOptionIdx === null);
    // تعيين onclick لتسجيل الإجابة ثم الانتقال
    nextBtn.innerHTML = isLast ? `<i class="fas fa-flag-checkered"></i> إنهاء` : `<i class="fas fa-arrow-left"></i> التالي`;
    nextBtn.onclick = () => {
      if (state.selectedOptionIdx === null) return;
      // إذا لم تكن الإجابة مسجلة بعد (في حال لم يتم استدعاء finalizeAnswer)
      if (!st.answered) {
        const qCurrent = state.quizQuestions[state.currentIndex];
        let isCorrect = false;
        if (qCurrent.isTF) {
          const opt = document.querySelector(`.option[data-idx="${state.selectedOptionIdx}"]`);
          isCorrect = opt.dataset.correct === 'true';
        } else {
          isCorrect = !!qCurrent.options[state.selectedOptionIdx].correct;
        }
        finalizeAnswer(isCorrect, [state.selectedOptionIdx]);
      }
      // الانتقال إلى التالي أو النتائج
      stopTimer();
      goToNextOrFinish();
    };
  } else {
    // وضع التدريب: الزر يعمل بشكل عادي (التسجيل فوري عند الاختيار)
    nextBtn.disabled = false;
    nextBtn.innerHTML = isLast ? `<i class="fas fa-flag-checkered"></i> إنهاء` : `<i class="fas fa-arrow-left"></i> التالي`;
    nextBtn.onclick = () => nextQuestion();
  }
  if(!st.answered) startTimer(); else stopTimer();
}
// ============ نهاية التعديل ============

function onOptionClick(i){
  if(state.answered) return;
  state.selectedOptionIdx=i;
  document.querySelectorAll('.option').forEach(el=>el.classList.remove('selected'));
  document.querySelector(`.option[data-idx="${i}"]`).classList.add('selected');
  // في وضع الاختبار، لا نرسل الإجابة فوراً، بل ننتظر الضغط على "التالي"
  if(state.mode==='test'){
    // نفعّل زر التالي بعد الاختيار
    document.getElementById('btn-next').disabled = false;
  } else {
    // في وضع التدريب، نرسل الإجابة فوراً
    submitSingleAnswer(i);
  }
}

function submitSingleAnswer(i){
  const q=state.quizQuestions[state.currentIndex];
  let isCorrect=false;
  if(q.isTF){
    const opt=document.querySelector(`.option[data-idx="${i}"]`);
    isCorrect=opt.dataset.correct==='true';
  }else{
    isCorrect=!!q.options[i].correct;
  }
  finalizeAnswer(isCorrect,[i]);
}

function finalizeAnswer(isCorrect,chosenIdxs){
  stopTimer();
  state.answered=true;
  const idx=state.currentIndex;
  const st=state.questionStates[idx];
  st.selectedOption=state.selectedOptionIdx;
  st.answered=true;
  st.isCorrect=isCorrect;
  st.chosenIdxs=chosenIdxs;
  const q=state.quizQuestions[idx];
  if(isCorrect) state.correctCount++;
  else state.wrongCount++;
  const p=loadProgress();
  const key=qid(q.sectionName,q.num);
  p.attempted=p.attempted||{};
  p.mistakes=p.mistakes||{};
  p.attempted[key]=isCorrect?'correct':'wrong';
  if(isCorrect){
    delete p.mistakes[key];
  }else{
    p.mistakes[key]=true;
  }
  saveProgress(p);
  if(!isCorrect){
    state.sessionMistakes.push({q,chosenIdxs});
  }
  renderQuestion();
}

function goToNextOrFinish(){
  if(state.currentIndex<state.quizQuestions.length-1){
    state.currentIndex++;
    renderQuestion();
  }else{
    showResults();
  }
}
function nextQuestion(){
  if(!state.answered && state.mode!=='test') return;
  if(state.currentIndex<state.quizQuestions.length-1){
    state.currentIndex++;
    renderQuestion();
  }else{
    showResults();
  }
}
function previousQuestion(){
  if(state.currentIndex>0){
    state.currentIndex--;
    renderQuestion();
  }
}
function showResults(){
  stopTimer();
  document.getElementById('screen-quiz').classList.remove('active');
  document.getElementById('screen-results').classList.add('active');
  document.getElementById('mistakes-list-wrap').classList.add('hidden');
  const total=state.quizQuestions.length,pct=total?Math.round((state.correctCount/total)*100):0;
  document.getElementById('result-pct').textContent=pct+'%';
  document.getElementById('score-circle').style.setProperty('--pct',pct);
  document.getElementById('res-total').textContent=total;
  document.getElementById('res-correct').textContent=state.correctCount;
  document.getElementById('res-wrong').textContent=state.wrongCount;
  const btnMistakes=document.getElementById('btn-show-mistakes');
  if(state.sessionMistakes.length>0) btnMistakes.classList.remove('hidden');
  else btnMistakes.classList.add('hidden');
}

    explainDiv.textContent=`💡 ${q.explain_ar||''}`;
    detailDiv.appendChild(explainDiv);
    toggleBtn.onclick=()=>{
      const vis=detailDiv.style.display!=='none';
      detailDiv.style.display=vis?'none':'block';
      toggleBtn.innerHTML=vis?'<i class="fas fa-eye"></i> عرض السؤال':'<i class="fas fa-eye-slash"></i> إخفاء السؤال';
    };
    div.innerHTML=`<div class="m-q">${q.num}. ${q.en}</div><div class="m-you">إجابتك: ${yourAnswers}</div><div class="m-correct">الصح: ${correctAnswers}</div>`;
    div.appendChild(toggleBtn);
    div.appendChild(detailDiv);
    list.appendChild(div);
  });
  wrap.classList.remove('hidden');
  wrap.scrollIntoView({behavior:'smooth'});
}
function stopTimer(){
  if(state.timerInterval){
    clearInterval(state.timerInterval);
    state.timerInterval=null;
  }
  const b=document.getElementById('timer-badge');
  b.classList.add('hidden');
  b.classList.remove('warn','danger');
}
function startTimer(){
  stopTimer();
  if(!state.timerSeconds||state.timerSeconds<=0)return;
  const badge=document.getElementById('timer-badge');
  state.timeLeft=state.timerSeconds;
  badge.classList.remove('hidden','warn','danger');
  badge.innerHTML=`<i class="fas fa-hourglass-half"></i> ${state.timeLeft}`;
  state.timerInterval=setInterval(()=>{
    state.timeLeft--;
    if(state.timeLeft<=0){
      badge.innerHTML=`<i class="fas fa-hourglass-end"></i> 0`;
      stopTimer();
      onTimeUp();
      return;
    }
    badge.innerHTML=`<i class="fas fa-hourglass-half"></i> ${state.timeLeft}`;
    badge.classList.toggle('warn',state.timeLeft<=3&&state.timeLeft>1);
    badge.classList.toggle('danger',state.timeLeft<=1);
  },1000);
}
function onTimeUp(){
  if(state.answered)return;
  const q=state.quizQuestions[state.currentIndex];
  const chosen=state.selectedOptionIdx!==null?[state.selectedOptionIdx]:[];
  finalizeAnswer(false,chosen);
}
function getMaleEnglishVoice(){
  if(maleEnglishVoice)return maleEnglishVoice;
  const voices=window.speechSynthesis.getVoices();
  let v=voices.find(v=>v.lang==='en-US'&&v.name.toLowerCase().includes('male'));
  if(!v)v=voices.find(v=>v.lang==='en-GB'&&v.name.toLowerCase().includes('male'));
  if(!v)v=voices.find(v=>v.lang.startsWith('en')&&v.name.toLowerCase().includes('male'));
  if(!v)v=voices.find(v=>v.lang.startsWith('en'));
  maleEnglishVoice=v;
  return v;
}
function speakWord(word){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(word);
  u.lang='en-US';
  u.rate=.7;
  u.pitch=1;
  u.volume=1;
  const v=getMaleEnglishVoice();
  if(v)u.voice=v;
  window.speechSynthesis.speak(u);
}
function wrapEnglishText(text,container){
  if(!container)return;
  container.innerHTML='';
  if(!text)return;
  const words=text.split(' ');
  words.forEach((word,idx)=>{
    if(word.trim()===''){
      container.appendChild(document.createTextNode(' '));
      return;
    }
    const span=document.createElement('span');
    span.className='word-en';
    span.textContent=word;
    let pressTimer=null;
    const startPress=()=>{
      pressTimer=setTimeout(()=>{
        speakWord(word);
        span.classList.add('speaking');
        setTimeout(()=>span.classList.remove('speaking'),600);
        const hint=document.getElementById('speech-hint');
        hint.textContent=`🔊 ${word}`;
        hint.classList.add('show');
        setTimeout(()=>hint.classList.remove('show'),1000);
      },1000);
    };
    const endPress=()=>{
      if(pressTimer){
        clearInterval(pressTimer);
        pressTimer=null;
      }
    };
    span.addEventListener('pointerdown',startPress);
    span.addEventListener('pointerup',endPress);
    span.addEventListener('pointerleave',endPress);
    span.addEventListener('touchstart',startPress,{passive:true});
    span.addEventListener('touchend',endPress,{passive:true});
    span.addEventListener('touchcancel',endPress,{passive:true});
    container.appendChild(span);
    if(idx<words.length-1)container.appendChild(document.createTextNode(' '));
  });
}

document.addEventListener('click',function(e){
  const btn=e.target.closest('.big-btn');
  if(!btn)return;
  const rect=btn.getBoundingClientRect();
  const ripple=document.createElement('span');
  ripple.className='ripple';
  const size=Math.max(rect.width,rect.height);
  ripple.style.width=ripple.style.height=size+'px';
  ripple.style.left=(e.clientX-rect.left-size/2)+'px';
  ripple.style.top=(e.clientY-rect.top-size/2)+'px';
  btn.appendChild(ripple);
  setTimeout(()=>ripple.remove(),500);
});

document.addEventListener('DOMContentLoaded',()=>{enterApp();});
</script>
